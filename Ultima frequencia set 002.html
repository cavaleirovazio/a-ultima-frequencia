<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap');
:root{--green:#a5c9a1;--dim:#718a72;--bg:#080d0b;--panel:#111a15;--line:#344637;--red:#b45d58}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#17231b 0%,#080d0b 75%);color:var(--green);font-family:'Share Tech Mono',monospace}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(transparent 0,transparent 3px,#0008 4px);z-index:10}
main{width:min(760px,92%);margin:auto;padding:30px 0 55px}
header{text-align:center;padding:25px 10px;border-bottom:1px solid var(--line)}
.logo{font-size:clamp(28px,6vw,48px);letter-spacing:4px;text-shadow:0 0 15px #7eaa80}
.subtitle{color:var(--dim);letter-spacing:4px;font-size:12px;margin-top:10px}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 5px;color:var(--dim);font-size:12px}
.meter{height:4px;background:#253329}.meter>div{height:100%;width:0;background:var(--green);transition:width .3s}
.panel{background:#111a15ed;border:1px solid var(--line);padding:clamp(18px,5vw,30px);margin-top:15px;box-shadow:0 0 30px #0008}
.scene-title{font-family:'Special Elite',serif;color:#d0dfc9;font-size:25px;margin:0 0 20px}
.story{font-family:'Special Elite',serif;color:#c2cdbd;font-size:17px;line-height:1.85;white-space:pre-line}
.options{display:grid;gap:10px;margin-top:26px}
button,select{background:#142019;border:1px solid #526b53;color:var(--green);padding:13px;font:inherit}
button{text-align:left;cursor:pointer;transition:.2s}
button:hover{background:#263a2b;border-color:#a5c9a1;color:white}
button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}
select{width:100%;margin-top:9px}
.small{color:var(--dim);font-size:11px;margin-top:24px;text-align:center}
.menu{text-align:center}
.menu .scene-title{font-size:30px}
.menu p{font-family:'Special Elite',serif;line-height:1.7;color:#c2cdbd}
.field{text-align:left;margin:25px auto 10px;max-width:340px}
.field label{font-size:12px;color:var(--dim);letter-spacing:2px}
.photo{border:1px solid #67745e;background:#20271f;padding:18px;margin:20px auto;max-width:310px;text-align:center;color:#c7c3a8;font-family:'Special Elite',serif}
.photo-frame{height:155px;display:grid;place-items:center;border:5px solid #4b4a3e;background:linear-gradient(135deg,#555747,#252b25);font-size:42px;filter:sepia(.5)}
.photo small{display:block;margin-top:12px}
.hidden{display:none}
.footer{color:var(--dim);font-size:10px;text-align:center;letter-spacing:2px;margin-top:25px}
</style>

<script>
const I18N = {
  pt: {
    menuTitle:"Uma frequência desconhecida",
    menuDescription:"A estação está aberta. A transmissão está prestes a começar.",
    languageLabel:"SELECIONE O IDIOMA",
    start:"INICIAR TRANSMISSÃO",
    menuHint:"Sua escolha de idioma será salva neste navegador.",
    night:"NOITE",
    end:"FIM DA TRANSMISSÃO",
    scenes:{
      start:["Mais uma noite",`O relógio marca 23h47.\n\nMais um turno. Mais uma noite na estação.\n\nO corredor está vazio. As lâmpadas fluorescentes fazem um ruído baixo e constante. Você conhece aquele som tão bem que já nem percebe.\n\nAo entrar na cabine, deixa suas coisas sobre a mesa e liga os equipamentos.\n\nTudo parece normal.\n\nPelo menos por enquanto.`,["Organizar os equipamentos","Olhar a fotografia na mesa","Ligar o rádio"]],
      equipment:["Rotina",`Você confere os botões, ajusta os níveis e organiza alguns papéis.\n\nO mesmo procedimento de sempre.\n\nPor um instante, tem a impressão de ter visto alguém parado no corredor, perto da entrada da cabine.\n\nQuando olha novamente, não há ninguém.\n\nO rádio começa a emitir estática.`,["Verificar a frequência","Ignorar e continuar trabalhando"]],
      photo:["Uma lembrança",`Entre alguns papéis, há uma fotografia antiga.\n\nÉ sua mãe.\n\nVocê se lembra daquele período da sua vida. De quando ela ainda estava presente, das conversas simples e dos momentos que pareciam não ter importância na época.\n\nPor alguns segundos, a estação deixa de parecer tão vazia.\n\nVocê coloca a fotografia de volta no lugar.`,["Voltar ao trabalho"]],
      radio:["Frequência desconhecida",`O rádio muda de frequência sozinho.\n\nVocê tenta ajustar o seletor, mas uma voz surge no meio da estática.\n\nÉ uma voz familiar.\n\nFamiliar demais.\n\n— Está me ouvindo?\n\nVocê fica imóvel.\n\nA voz continua:\n\n— Sou eu. Escuta com atenção. Não atenda o telefone daqui a cinco minutos.\n\nÉ a sua própria voz.\n\nMas você não está falando.`,["Responder à transmissão","Anotar a frequência","Desligar o rádio"]],
      answerRadio:["Do outro lado",`— Quem está falando?\n\nA resposta demora.\n\n— Você não tem muito tempo. Só preciso que me escute.\n\nUm ruído interrompe a transmissão.\n\n— Não importa o que aconteça, não saia da cabine.\n\nA voz parece querer dizer mais alguma coisa, mas desaparece.`,["Esperar"]],
      noteFrequency:["Anotação",`Você anota a frequência em um pedaço de papel.\n\nA voz parece estar muito próxima do microfone.\n\n— Não atenda o telefone.\n\nVocê olha para o aparelho sobre a mesa.\n\nEle ainda não tocou.`,["Esperar"]],
      radioOff:["Silêncio",`Você desliga o rádio.\n\nO silêncio dura pouco.\n\nO telefone começa a tocar.\n\nUma vez.\n\nDuas vezes.\n\nTrês vezes.\n\nVocê se lembra do aviso.`,["Atender o telefone","Não atender"]],
      phone:["Cinco minutos",`O relógio muda para meia-noite.\n\nO telefone começa a tocar.\n\nVocê olha para o aparelho.\n\nA voz do rádio ainda ecoa na sua cabeça:\n\n"Não atenda o telefone daqui a cinco minutos."\n\nO telefone continua tocando.`,["Atender","Deixar tocar"]],
      phoneAnswer:["A ligação",`Você atende.\n\n— Alô?\n\nDo outro lado, uma voz conhecida parece aflita.\n\n— Preciso que você venha aqui. É urgente.\n\nVocê pergunta o que aconteceu.\n\n— Não dá para explicar pelo telefone. Vem logo.\n\nA ligação termina.\n\nVocê reconhece a voz como sendo a do seu colega.\n\nMas há algo estranho na maneira como ele falou.`,["Sair da cabine","Tentar ligar de volta"]],
      phoneWait:["A insistência",`Você decide não atender.\n\nO telefone para.\n\nPouco depois, toca novamente.\n\nDessa vez, o rádio liga sozinho.\n\nUma voz sussurra:\n\n— Você precisa ir. Não temos muito tempo.\n\nO telefone continua tocando.`,["Atender","Sair para verificar"]],
      callBack:["Sem resposta",`Você tenta retornar a ligação.\n\nNenhuma resposta.\n\nO rádio começa a chiar novamente.\n\n— Não devia ter feito isso.\n\nA voz é a mesma de antes.\n\nVocê percebe que a situação está fugindo do seu controle.`,["Sair para procurar seu colega"]],
      outside:["O corredor",`O corredor parece maior do que você se lembrava.\n\nAs luzes piscam.\n\nVocê chama pelo seu colega, mas não recebe resposta.\n\nAo chegar ao final do corredor, encontra seu colega.\n\nEle já não pode responder.\n\nVocê se aproxima e percebe que chegou tarde demais.\n\nO silêncio da estação parece ocupar todo o espaço.\n\nEntão, atrás de você, uma porta se abre.\n\nAlguém está entrando na cabine.`,["Olhar para a cabine","Permanecer ao lado do colega"]],
      stranger:["A outra pessoa",`Um homem caminha em direção à sua cabine.\n\nEle não parece demonstrar preocupação com o que acabou de acontecer.\n\nVocê tenta enxergar seu rosto, mas a iluminação não permite.\n\nSó consegue notar a camisa.\n\nÉ muito parecida com a sua.\n\nO homem entra na cabine e se senta diante dos equipamentos.\n\nEle organiza os objetos sobre a mesa.\n\nExatamente como você costuma fazer.\n\nO rádio está ligado.\n\nVocê ouve sua própria voz vindo de dentro da cabine.`,["Tentar enxergar o rosto","Escutar a transmissão"]],
      endNight1:["Fim da primeira transmissão",`A estática aumenta.\n\nVocê tenta compreender o que está ouvindo.\n\nA voz parece estar falando com alguém.\n\nAlguém que ainda não sabe o que está prestes a acontecer.\n\nA imagem da cabine começa a desaparecer no ruído.\n\nFIM DA NOITE 01.`,["Continuar para a noite 02"]],
      night2:["A gravação",`Você volta à estação.\n\nOu talvez nunca tenha saído.\n\nHá uma gravação sobre a mesa. O arquivo não tem identificação, apenas alguns números:\n\nSET_002_0001\n\nVocê coloca os fones e aperta o botão de reprodução.\n\nPrimeiro, silêncio.\n\nDepois, sua própria voz:\n\n— Não atenda o telefone daqui a cinco minutos.\n\nÉ a mesma transmissão da noite anterior.\n\nMas dessa vez você percebe um detalhe.\n\nAo fundo, existe outro som.\n\nUma respiração.`,["Ouvir novamente","Investigar o arquivo","Ligar o rádio"]],
      recording:["A voz",`Você ouve a gravação mais uma vez.\n\nA voz parece cansada.\n\nEm determinado momento, ela faz uma pausa.\n\nEntão diz algo que você não tinha percebido:\n\n— Eu já tentei.\n\nA gravação termina.`,["Ligar o rádio"]],
      file:["Arquivo 0001",`O arquivo não possui data de criação.\n\nO campo de autor está preenchido com seu nome.\n\nVocê verifica as propriedades novamente.\n\nO mesmo resultado.\n\nVocê não se lembra de ter gravado aquilo.`,["Ligar o rádio"]],
      night2radio:["Uma tentativa",`A frequência muda.\n\nVocê ouve a própria voz novamente.\n\n— Se você está ouvindo isso, ainda dá tempo.\n\nUma pausa.\n\n— Eu sei o que você vai fazer. Sei que vai atender.\n\nVocê tenta responder.\n\n— Quem é você?\n\nA voz parece hesitar.\n\n— Você já sabe.`,["Perguntar sobre o colega","Perguntar quem está na cabine"]],
      night2end:["O mesmo lugar",`A transmissão termina.\n\nVocê olha para a mesa.\n\nA fotografia continua no mesmo lugar.\n\nOs papéis também.\n\nPor um instante, tem a sensação de que já viveu exatamente aquele momento.\n\nVocê não consegue explicar.\n\nFIM DA NOITE 02.`,["Continuar para a noite 03"]],
      night3:["O corredor vazio",`O turno começa como sempre.\n\nVocê caminha pelo corredor em direção à cabine.\n\nAntes de entrar, percebe uma movimentação perto da outra extremidade.\n\nAlguém está parado ali.\n\nUma camisa parecida com a sua.\n\nVocê tenta observar melhor, mas a pessoa já está se afastando.\n\nPor algum motivo, você não vai atrás.\n\nEntra na cabine e começa o trabalho.\n\nA lembrança daquele instante fica incomodando.`,["Tentar lembrar quem estava ali","Ignorar e trabalhar"]],
      memory:["Uma frase antiga",`Você tenta lembrar.\n\nAquela postura.\n\nAquela camisa.\n\nA maneira como a pessoa caminhava.\n\nEntão uma lembrança antiga aparece.\n\nUma frase que sua mãe costumava dizer:\n\n"Não se envolva se não tem a ver com você."\n\nVocê não sabe por que se lembrou disso agora.\n\nMas a sensação de familiaridade não desaparece.`,["Voltar ao rádio"]],
      night3radio:["A voz que chama",`A frequência desconhecida retorna.\n\n— Você viu?\n\nA voz está mais próxima.\n\n— Viu quem entrou na cabine?\n\nVocê pergunta quem é aquela pessoa.\n\nA resposta vem quase imediatamente:\n\n— Você não olhou direito.\n\nA transmissão é interrompida por um ruído.`,["Perguntar o que isso significa","Tentar localizar a transmissão"]],
      night3end:["Repetição",`Você olha para o corredor.\n\nPor alguns segundos, tem a impressão de ouvir passos.\n\nMas não há ninguém.\n\nNo papel sobre a mesa, você encontra uma anotação que não se lembra de ter escrito:\n\n"Eu já estive aqui."\n\nFIM DA NOITE 03.`,["Continuar para a noite 04"]],
      night4:["A ligação original",`Você encontra uma gravação de uma ligação telefônica.\n\nA data não faz sentido.\n\nO arquivo foi registrado antes do início do seu turno.\n\nVocê aperta o botão de reprodução.\n\nUma voz pede ajuda.\n\nVocê reconhece a voz do seu colega.\n\nMas, ao fundo, existe outra voz.\n\nA sua.\n\nVocê aumenta o volume.`,["Ouvir com atenção","Comparar com a gravação do rádio"]],
      callReveal:["A mesma voz",`A voz ao fundo fica mais clara.\n\nEla diz:\n\n— Vem logo. Preciso que você venha.\n\nVocê conhece aquela entonação.\n\nAquela pausa antes da última palavra.\n\nÉ a sua voz.\n\nVocê afasta os fones por um instante.\n\nNão consegue entender como isso é possível.`,["Ouvir a comparação"]],
      compare:["Duas gravações",`Você coloca as duas gravações lado a lado.\n\nA transmissão do rádio.\n\nA ligação telefônica.\n\nAs vozes são idênticas.\n\nNão são apenas parecidas.\n\nVocê reconhece a maneira como pronuncia cada palavra.\n\nA ligação não foi feita pelo seu colega.\n\nFoi feita por você.\n\nOu por alguém que soa exatamente como você.`,["Tentar transmitir uma mensagem","Desligar todos os equipamentos"]],
      transmit:["A mensagem",`Você se senta diante do microfone.\n\nPrecisa avisar a outra versão de você.\n\nPrecisa impedir que ela saia da cabine.\n\nVocê aperta o botão de transmissão.\n\n— Está me ouvindo?\n\nA estática responde.\n\nVocê respira fundo.\n\n— Sou eu. Não atenda o telefone daqui a cinco minutos.\n\nPor alguns segundos, não há resposta.\n\nEntão você ouve:\n\n— Quem está falando?`,["Continuar falando"]],
      night4end:["O começo",`Você reconhece a pergunta.\n\nÉ exatamente o que perguntou na primeira noite.\n\nTenta explicar.\n\nTenta avisar.\n\nMas a transmissão começa a falhar.\n\nVocê percebe que está repetindo as mesmas palavras que ouviu.\n\nA mesma mensagem.\n\nA mesma sequência.\n\nFIM DA NOITE 04.`,["Continuar para a noite 05"]],
      night5:["A cabine",`Você está novamente diante do microfone.\n\nA frequência está aberta.\n\nO telefone está sobre a mesa.\n\nA gravação está pronta.\n\nVocê sabe o que aconteceu.\n\nSabe que tentou impedir a ligação.\n\nSabe que seu colega não voltou.\n\nE sabe que, em algum momento, alguém entrou na cabine.\n\nVocê olha para o vidro que separa a cabine do corredor.\n\nUma figura está se aproximando.`,["Observar a figura","Tentar transmitir novamente"]],
      finalScene:["O reflexo",`A figura entra na cabine.\n\nA mesma camisa.\n\nA mesma postura.\n\nOs mesmos movimentos.\n\nVocê tenta enxergar o rosto.\n\nPor um instante, a pessoa vira na sua direção.\n\nE tudo se encaixa.\n\nA cabine.\n\nA fotografia.\n\nA ligação.\n\nA voz.\n\nVocê lembra da primeira noite, quando viu alguém entrar e simplesmente ignorou.\n\nEntão a pergunta escapa:\n\n"Pera, aquele sou eu?"\n\nO homem está sentado diante do microfone.\n\nEle organiza os objetos sobre a mesa.\n\nExatamente como você costuma fazer.\n\nVocê entende.\n\nAquela ligação foi sua.\n\nAquela transmissão foi sua.\n\nVocê estava tentando impedir algo que já fazia parte da sequência.\n\nO telefone toca.\n\nO rádio está aberto.\n\nE, do outro lado, alguém ainda não sabe o que vai acontecer.`,["Atender o telefone","Falar pelo rádio","Permanecer em silêncio"]],
      trueEnding:["SET 002",`A estática ocupa a cabine.\n\nA transmissão continua.\n\nUma voz começa a falar.\n\nA sua voz.\n\n— Não atenda o telefone daqui a cinco minutos.\n\nO relógio marca 23h55.\n\nVocê reconhece cada detalhe.\n\nA frase.\n\nA pausa.\n\nA respiração.\n\nA estação continua funcionando.\n\nO turno ainda não terminou.\n\nE, em algum ponto do tempo, tudo começa novamente.\n\n"Algumas frequências não transmitem o passado. Elas o repetem."\n\nFIM DA TRANSMISSÃO.\n\nSET 002: MIDNIGHT FREQUENCY`,["Voltar ao início"]],
      gameover:["Sinal perdido",`Você desliga os equipamentos.\n\nA estação fica em silêncio.\n\nPor alguns segundos, parece que tudo terminou.\n\nEntão o telefone toca.\n\nVocê olha para ele.\n\nO visor não mostra nenhum número.\n\nA transmissão desaparece.\n\nA frequência foi perdida.\n\nGAME OVER — SINAL PERDIDO.`,["Tentar novamente"]]
    }
  },
  en: {
    menuTitle:"An unknown frequency",
    menuDescription:"The station is open. The broadcast is about to begin.",
    languageLabel:"SELECT LANGUAGE",
    start:"START BROADCAST",
    menuHint:"Your language choice will be saved in this browser.",
    night:"NIGHT",
    end:"END OF TRANSMISSION",
    scenes:{
      start:["Another night",`The clock reads 11:47 PM.\n\nAnother shift. Another night at the station.\n\nThe hallway is empty. The fluorescent lights make a low, steady hum. You know that sound so well you barely notice it anymore.\n\nYou enter the booth, leave your things on the desk, and turn on the equipment.\n\nEverything seems normal.\n\nAt least for now.`,["Organize the equipment","Look at the photograph on the desk","Turn on the radio"]],
      equipment:["Routine",`You check the buttons, adjust the levels, and organize a few papers.\n\nThe same routine as always.\n\nFor a moment, you think you saw someone standing in the hallway near the booth.\n\nWhen you look again, nobody is there.\n\nThe radio begins to crackle.`,["Check the frequency","Ignore it and keep working"]],
      photo:["A memory",`Among the papers, there is an old photograph.\n\nIt is your mother.\n\nYou remember that time in your life. When she was still here, the simple conversations, and the moments that did not seem important back then.\n\nFor a few seconds, the station feels less empty.\n\nYou put the photograph back.`,["Return to work"]],
      radio:["Unknown frequency",`The radio changes frequency on its own.\n\nYou try to adjust the dial, but a voice emerges through the static.\n\nIt sounds familiar.\n\nFar too familiar.\n\n— Can you hear me?\n\nYou freeze.\n\nThe voice continues:\n\n— It's me. Listen carefully. Don't answer the phone in five minutes.\n\nIt is your own voice.\n\nBut you are not speaking.`,["Answer the broadcast","Write down the frequency","Turn off the radio"]],
      answerRadio:["On the other side",`— Who is this?\n\nThe answer takes a while.\n\n— You don't have much time. I just need you to listen.\n\nA burst of noise interrupts the broadcast.\n\n— No matter what happens, don't leave the booth.\n\nThe voice seems to want to say more, but it disappears.`,["Wait"]],
      noteFrequency:["A note",`You write the frequency on a piece of paper.\n\nThe voice sounds very close to the microphone.\n\n— Don't answer the phone.\n\nYou look at the device on the desk.\n\nIt has not rung yet.`,["Wait"]],
      radioOff:["Silence",`You turn off the radio.\n\nThe silence does not last long.\n\nThe phone begins to ring.\n\nOnce.\n\nTwice.\n\nThree times.\n\nYou remember the warning.`,["Answer the phone","Don't answer"]],
      phone:["Five minutes",`The clock changes to midnight.\n\nThe phone begins to ring.\n\nYou look at it.\n\nThe radio voice still echoes in your head:\n\n"Don't answer the phone in five minutes."\n\nThe phone keeps ringing.`,["Answer","Let it ring"]],
      phoneAnswer:["The call",`You answer.\n\n— Hello?\n\nA familiar voice on the other end sounds distressed.\n\n— I need you to come here. It's urgent.\n\nYou ask what happened.\n\n— I can't explain over the phone. Just come.\n\nThe call ends.\n\nYou recognize your colleague's voice.\n\nBut something about the way they spoke feels strange.`,["Leave the booth","Try calling back"]],
      phoneWait:["The insistence",`You decide not to answer.\n\nThe phone stops.\n\nA little later, it rings again.\n\nThis time, the radio turns on by itself.\n\nA voice whispers:\n\n— You need to go. We don't have much time.\n\nThe phone keeps ringing.`,["Answer","Go and check"]],
      callBack:["No answer",`You try to call back.\n\nNo answer.\n\nThe radio crackles again.\n\n— You shouldn't have done that.\n\nIt is the same voice as before.\n\nYou realize the situation is slipping out of your control.`,["Leave to look for your colleague"]],
      outside:["The hallway",`The hallway seems longer than you remember.\n\nThe lights flicker.\n\nYou call for your colleague, but there is no answer.\n\nAt the end of the hallway, you find them.\n\nThey can no longer answer.\n\nYou approach and realize you are too late.\n\nThe station's silence seems to fill the entire space.\n\nThen a door opens behind you.\n\nSomeone is entering the booth.`,["Look toward the booth","Stay beside your colleague"]],
      stranger:["The other person",`A man walks toward your booth.\n\nHe does not seem concerned by what has just happened.\n\nYou try to see his face, but the lighting will not allow it.\n\nYou can only make out his shirt.\n\nIt looks very much like yours.\n\nThe man enters the booth and sits in front of the equipment.\n\nHe arranges the objects on the desk.\n\nExactly as you usually do.\n\nThe radio is on.\n\nYou hear your own voice coming from inside the booth.`,["Try to see his face","Listen to the broadcast"]],
      endNight1:["End of the first broadcast",`The static grows louder.\n\nYou try to understand what you are hearing.\n\nThe voice seems to be speaking to someone.\n\nSomeone who still does not know what is about to happen.\n\nThe image of the booth begins to fade into the noise.\n\nEND OF NIGHT 01.`,["Continue to night 02"]],
      night2:["The recording",`You return to the station.\n\nOr perhaps you never left.\n\nThere is a recording on the desk. The file has no label, only a few numbers:\n\nSET_002_0001\n\nYou put on your headphones and press play.\n\nFirst, silence.\n\nThen, your own voice:\n\n— Don't answer the phone in five minutes.\n\nIt is the same broadcast from the previous night.\n\nBut this time you notice something.\n\nIn the background, there is another sound.\n\nBreathing.`,["Listen again","Inspect the file","Turn on the radio"]],
      recording:["The voice",`You listen to the recording once more.\n\nThe voice sounds tired.\n\nAt one point, it pauses.\n\nThen it says something you had not noticed:\n\n— I've already tried.\n\nThe recording ends.`,["Turn on the radio"]],
      file:["File 0001",`The file has no creation date.\n\nThe author field contains your name.\n\nYou check the properties again.\n\nThe result is the same.\n\nYou do not remember recording it.`,["Turn on the radio"]],
      night2radio:["An attempt",`The frequency changes.\n\nYou hear your own voice again.\n\n— If you're hearing this, there's still time.\n\nA pause.\n\n— I know what you're going to do. I know you'll answer.\n\nYou try to respond.\n\n— Who are you?\n\nThe voice hesitates.\n\n— You already know.`,["Ask about your colleague","Ask who is in the booth"]],
      night2end:["The same place",`The broadcast ends.\n\nYou look at the desk.\n\nThe photograph is still in the same place.\n\nSo are the papers.\n\nFor a moment, you feel as if you have lived through this exact moment before.\n\nYou cannot explain it.\n\nEND OF NIGHT 02.`,["Continue to night 03"]],
      night3:["The empty hallway",`The shift begins as usual.\n\nYou walk down the hallway toward the booth.\n\nBefore entering, you notice movement at the far end.\n\nSomeone is standing there.\n\nA shirt like yours.\n\nYou try to get a better look, but the person is already walking away.\n\nFor some reason, you do not follow.\n\nYou enter the booth and begin working.\n\nThe memory of that moment keeps bothering you.`,["Try to remember who was there","Ignore it and work"]],
      memory:["An old sentence",`You try to remember.\n\nThat posture.\n\nThat shirt.\n\nThe way the person walked.\n\nThen an old memory comes back.\n\nSomething your mother used to say:\n\n"Don't get involved if it has nothing to do with you."\n\nYou do not know why you remembered it now.\n\nBut the feeling of familiarity remains.`,["Return to the radio"]],
      night3radio:["The calling voice",`The unknown frequency returns.\n\n— Did you see?\n\nThe voice is closer now.\n\n— Did you see who entered the booth?\n\nYou ask who that person is.\n\nThe answer comes almost immediately:\n\n— You didn't look properly.\n\nThe broadcast is interrupted by a burst of noise.`,["Ask what it means","Try to locate the broadcast"]],
      night3end:["Repetition",`You look toward the hallway.\n\nFor a few seconds, you think you hear footsteps.\n\nBut nobody is there.\n\nOn the paper on your desk, you find a note you do not remember writing:\n\n"I have been here before."\n\nEND OF NIGHT 03.`,["Continue to night 04"]],
      night4:["The original call",`You find a recording of a phone call.\n\nThe date makes no sense.\n\nThe file was recorded before your shift began.\n\nYou press play.\n\nA voice asks for help.\n\nYou recognize your colleague's voice.\n\nBut in the background, there is another voice.\n\nYours.\n\nYou turn up the volume.`,["Listen carefully","Compare it with the radio recording"]],
      callReveal:["The same voice",`The background voice becomes clearer.\n\nIt says:\n\n— Come on. I need you to come.\n\nYou know that intonation.\n\nThat pause before the last word.\n\nIt is your voice.\n\nYou take off your headphones for a moment.\n\nYou cannot understand how this is possible.`,["Listen to the comparison"]],
      compare:["Two recordings",`You place the two recordings side by side.\n\nThe radio broadcast.\n\nThe phone call.\n\nThe voices are identical.\n\nNot merely similar.\n\nYou recognize the way you pronounce every word.\n\nThe call was not made by your colleague.\n\nIt was made by you.\n\nOr by someone who sounds exactly like you.`,["Try to send a message","Turn off all the equipment"]],
      transmit:["The message",`You sit in front of the microphone.\n\nYou need to warn the other version of yourself.\n\nYou need to stop them from leaving the booth.\n\nYou press the transmit button.\n\n— Can you hear me?\n\nThe static answers.\n\nYou take a deep breath.\n\n— It's me. Don't answer the phone in five minutes.\n\nFor a few seconds, there is no answer.\n\nThen you hear:\n\n— Who is this?`,["Keep talking"]],
      night4end:["The beginning",`You recognize the question.\n\nIt is exactly what you asked on the first night.\n\nYou try to explain.\n\nYou try to warn yourself.\n\nBut the broadcast begins to fail.\n\nYou realize you are repeating the same words you heard.\n\nThe same message.\n\nThe same sequence.\n\nEND OF NIGHT 04.`,["Continue to night 05"]],
      night5:["The booth",`You are standing in front of the microphone again.\n\nThe frequency is open.\n\nThe phone is on the desk.\n\nThe recording is ready.\n\nYou know what happened.\n\nYou know you tried to stop the call.\n\nYou know your colleague never came back.\n\nAnd you know that, at some point, someone entered the booth.\n\nYou look through the glass separating the booth from the hallway.\n\nA figure is approaching.`,["Watch the figure","Try to broadcast again"]],
      finalScene:["The reflection",`The figure enters the booth.\n\nThe same shirt.\n\nThe same posture.\n\nThe same movements.\n\nYou try to see the face.\n\nFor a moment, the person turns toward you.\n\nAnd everything falls into place.\n\nThe booth.\n\nThe photograph.\n\nThe call.\n\nThe voice.\n\nYou remember the first night, when you saw someone enter and simply ignored it.\n\nThen the question slips out:\n\n"Wait... is that me?"\n\nThe man sits in front of the microphone.\n\nHe arranges the objects on the desk.\n\nExactly as you usually do.\n\nYou understand.\n\nThat call was yours.\n\nThat broadcast was yours.\n\nYou were trying to stop something that was already part of the sequence.\n\nThe phone rings.\n\nThe radio is open.\n\nAnd somewhere on the other end, someone still does not know what is about to happen.`,["Answer the phone","Speak into the radio","Remain silent"]],
      trueEnding:["SET 002",`Static fills the booth.\n\nThe broadcast continues.\n\nA voice begins to speak.\n\nYour voice.\n\n— Don't answer the phone in five minutes.\n\nThe clock reads 11:55 PM.\n\nYou recognize every detail.\n\nThe sentence.\n\nThe pause.\n\nThe breathing.\n\nThe station keeps running.\n\nThe shift is not over.\n\nAnd somewhere in time, everything begins again.\n\n"Some frequencies do not transmit the past. They repeat it."\n\nEND OF TRANSMISSION.\n\nSET 002: MIDNIGHT FREQUENCY`,["Return to the beginning"]],
      gameover:["Signal lost",`You turn off the equipment.\n\nThe station falls silent.\n\nFor a few seconds, it seems to be over.\n\nThen the phone rings.\n\nYou look at it.\n\nThe display shows no number.\n\nThe broadcast disappears.\n\nThe frequency is lost.\n\nGAME OVER — SIGNAL LOST.`,["Try again"]]
    }
  },
  es: {
    menuTitle:"Una frecuencia desconocida",
    menuDescription:"La estación está abierta. La transmisión está a punto de comenzar.",
    languageLabel:"SELECCIONA EL IDIOMA",
    start:"INICIAR TRANSMISIÓN",
    menuHint:"Tu elección de idioma se guardará en este navegador.",
    night:"NOCHE",
    end:"FIN DE LA TRANSMISIÓN",
    scenes:{
      start:["Una noche más",`El reloj marca las 23:47.\n\nOtro turno. Otra noche en la estación.\n\nEl pasillo está vacío. Las luces fluorescentes producen un zumbido bajo y constante. Conoces tan bien ese sonido que casi ya no lo notas.\n\nEntras en la cabina, dejas tus cosas sobre la mesa y enciendes los equipos.\n\nTodo parece normal.\n\nAl menos por ahora.`,["Organizar los equipos","Mirar la fotografía sobre la mesa","Encender la radio"]],
      equipment:["Rutina",`Revisas los botones, ajustas los niveles y organizas algunos papeles.\n\nEl mismo procedimiento de siempre.\n\nPor un instante, crees haber visto a alguien de pie en el pasillo, cerca de la entrada de la cabina.\n\nCuando vuelves a mirar, no hay nadie.\n\nLa radio empieza a emitir estática.`,["Revisar la frecuencia","Ignorarlo y seguir trabajando"]],
      photo:["Un recuerdo",`Entre algunos papeles hay una fotografía antigua.\n\nEs tu madre.\n\nRecuerdas aquella época de tu vida. Cuando ella todavía estaba aquí, las conversaciones sencillas y los momentos que entonces no parecían importantes.\n\nPor unos segundos, la estación deja de parecer tan vacía.\n\nVuelves a poner la fotografía en su sitio.`,["Volver al trabajo"]],
      radio:["Frecuencia desconocida",`La radio cambia de frecuencia por sí sola.\n\nIntentas ajustar el dial, pero una voz aparece entre la estática.\n\nEs una voz familiar.\n\nDemasiado familiar.\n\n— ¿Puedes oírme?\n\nTe quedas inmóvil.\n\nLa voz continúa:\n\n— Soy yo. Escucha con atención. No contestes el teléfono dentro de cinco minutos.\n\nEs tu propia voz.\n\nPero tú no estás hablando.`,["Responder a la transmisión","Anotar la frecuencia","Apagar la radio"]],
      answerRadio:["Al otro lado",`— ¿Quién habla?\n\nLa respuesta tarda en llegar.\n\n— No tienes mucho tiempo. Solo necesito que me escuches.\n\nUn ruido interrumpe la transmisión.\n\n— Pase lo que pase, no salgas de la cabina.\n\nLa voz parece querer decir algo más, pero desaparece.`,["Esperar"]],
      noteFrequency:["Anotación",`Anotas la frecuencia en un trozo de papel.\n\nLa voz parece estar muy cerca del micrófono.\n\n— No contestes el teléfono.\n\nMiras el aparato sobre la mesa.\n\nTodavía no ha sonado.`,["Esperar"]],
      radioOff:["Silencio",`Apagas la radio.\n\nEl silencio dura poco.\n\nEl teléfono empieza a sonar.\n\nUna vez.\n\nDos veces.\n\nTres veces.\n\nRecuerdas la advertencia.`,["Contestar el teléfono","No contestar"]],
      phone:["Cinco minutos",`El reloj cambia a medianoche.\n\nEl teléfono empieza a sonar.\n\nLo miras.\n\nLa voz de la radio todavía resuena en tu cabeza:\n\n"No contestes el teléfono dentro de cinco minutos."\n\nEl teléfono sigue sonando.`,["Contestar","Dejar que siga sonando"]],
      phoneAnswer:["La llamada",`Contestas.\n\n— ¿Hola?\n\nAl otro lado, una voz conocida parece angustiada.\n\n— Necesito que vengas aquí. Es urgente.\n\nPreguntas qué ha pasado.\n\n— No puedo explicarlo por teléfono. Ven rápido.\n\nLa llamada termina.\n\nReconoces la voz de tu compañero.\n\nPero hay algo extraño en la manera en que habló.`,["Salir de la cabina","Intentar devolver la llamada"]],
      phoneWait:["La insistencia",`Decides no contestar.\n\nEl teléfono deja de sonar.\n\nPoco después, vuelve a sonar.\n\nEsta vez, la radio se enciende sola.\n\nUna voz susurra:\n\n— Tienes que ir. No tenemos mucho tiempo.\n\nEl teléfono sigue sonando.`,["Contestar","Salir a comprobarlo"]],
      callBack:["Sin respuesta",`Intentas devolver la llamada.\n\nNo hay respuesta.\n\nLa radio vuelve a crujir.\n\n— No deberías haber hecho eso.\n\nEs la misma voz de antes.\n\nTe das cuenta de que la situación se está saliendo de tu control.`,["Salir a buscar a tu compañero"]],
      outside:["El pasillo",`El pasillo parece más largo de lo que recuerdas.\n\nLas luces parpadean.\n\nLlamas a tu compañero, pero no recibes respuesta.\n\nAl llegar al final del pasillo, lo encuentras.\n\nYa no puede responder.\n\nTe acercas y comprendes que has llegado demasiado tarde.\n\nEl silencio de la estación parece ocupar todo el espacio.\n\nEntonces, detrás de ti, se abre una puerta.\n\nAlguien está entrando en la cabina.`,["Mirar hacia la cabina","Quedarte junto a tu compañero"]],
      stranger:["La otra persona",`Un hombre camina hacia tu cabina.\n\nNo parece preocupado por lo que acaba de suceder.\n\nIntentas verle la cara, pero la iluminación no lo permite.\n\nSolo distingues su camisa.\n\nSe parece mucho a la tuya.\n\nEl hombre entra en la cabina y se sienta frente a los equipos.\n\nOrdena los objetos sobre la mesa.\n\nExactamente como tú sueles hacerlo.\n\nLa radio está encendida.\n\nOyes tu propia voz desde el interior de la cabina.`,["Intentar verle la cara","Escuchar la transmisión"]],
      endNight1:["Fin de la primera transmisión",`La estática aumenta.\n\nIntentas comprender lo que estás oyendo.\n\nLa voz parece estar hablando con alguien.\n\nAlguien que todavía no sabe lo que está a punto de suceder.\n\nLa imagen de la cabina empieza a desaparecer entre el ruido.\n\nFIN DE LA NOCHE 01.`,["Continuar a la noche 02"]],
      night2:["La grabación",`Vuelves a la estación.\n\nO quizá nunca te fuiste.\n\nHay una grabación sobre la mesa. El archivo no tiene identificación, solo algunos números:\n\nSET_002_0001\n\nTe pones los auriculares y pulsas reproducir.\n\nPrimero, silencio.\n\nDespués, tu propia voz:\n\n— No contestes el teléfono dentro de cinco minutos.\n\nEs la misma transmisión de la noche anterior.\n\nPero esta vez notas un detalle.\n\nAl fondo, hay otro sonido.\n\nUna respiración.`,["Escuchar otra vez","Investigar el archivo","Encender la radio"]],
      recording:["La voz",`Escuchas la grabación una vez más.\n\nLa voz parece cansada.\n\nEn un momento, hace una pausa.\n\nEntonces dice algo que no habías notado:\n\n— Ya lo intenté.\n\nLa grabación termina.`,["Encender la radio"]],
      file:["Archivo 0001",`El archivo no tiene fecha de creación.\n\nEl campo de autor contiene tu nombre.\n\nVuelves a revisar las propiedades.\n\nEl resultado es el mismo.\n\nNo recuerdas haberlo grabado.`,["Encender la radio"]],
      night2radio:["Un intento",`La frecuencia cambia.\n\nVuelves a oír tu propia voz.\n\n— Si estás escuchando esto, todavía hay tiempo.\n\nUna pausa.\n\n— Sé lo que vas a hacer. Sé que contestarás.\n\nIntentas responder.\n\n— ¿Quién eres?\n\nLa voz parece dudar.\n\n— Ya lo sabes.`,["Preguntar por tu compañero","Preguntar quién está en la cabina"]],
      night2end:["El mismo lugar",`La transmisión termina.\n\nMiras la mesa.\n\nLa fotografía sigue en el mismo lugar.\n\nLos papeles también.\n\nPor un instante, tienes la sensación de haber vivido exactamente ese momento antes.\n\nNo puedes explicarlo.\n\nFIN DE LA NOCHE 02.`,["Continuar a la noche 03"]],
      night3:["El pasillo vacío",`El turno comienza como siempre.\n\nCaminas por el pasillo hacia la cabina.\n\nAntes de entrar, notas movimiento en el otro extremo.\n\nAlguien está allí.\n\nUna camisa parecida a la tuya.\n\nIntentas mirar mejor, pero la persona ya se está alejando.\n\nPor alguna razón, no la sigues.\n\nEntras en la cabina y empiezas a trabajar.\n\nEl recuerdo de ese instante no deja de molestarte.`,["Intentar recordar quién estaba allí","Ignorarlo y trabajar"]],
      memory:["Una frase antigua",`Intentas recordar.\n\nEsa postura.\n\nEsa camisa.\n\nLa forma de caminar de aquella persona.\n\nEntonces aparece un recuerdo antiguo.\n\nUna frase que tu madre solía decir:\n\n"No te metas si no tiene que ver contigo."\n\nNo sabes por qué la recordaste ahora.\n\nPero la sensación de familiaridad no desaparece.`,["Volver a la radio"]],
      night3radio:["La voz que llama",`La frecuencia desconocida regresa.\n\n— ¿Lo viste?\n\nLa voz está más cerca.\n\n— ¿Viste quién entró en la cabina?\n\nPreguntas quién es esa persona.\n\nLa respuesta llega casi de inmediato:\n\n— No miraste bien.\n\nLa transmisión se interrumpe con un ruido.`,["Preguntar qué significa","Intentar localizar la transmisión"]],
      night3end:["Repetición",`Miras hacia el pasillo.\n\nDurante unos segundos, crees oír pasos.\n\nPero no hay nadie.\n\nEn el papel sobre la mesa encuentras una nota que no recuerdas haber escrito:\n\n"Ya estuve aquí."\n\nFIN DE LA NOCHE 03.`,["Continuar a la noche 04"]],
      night4:["La llamada original",`Encuentras una grabación de una llamada telefónica.\n\nLa fecha no tiene sentido.\n\nEl archivo fue registrado antes de que comenzara tu turno.\n\nPulsas reproducir.\n\nUna voz pide ayuda.\n\nReconoces la voz de tu compañero.\n\nPero al fondo hay otra voz.\n\nLa tuya.\n\nSubes el volumen.`,["Escuchar con atención","Compararla con la grabación de la radio"]],
      callReveal:["La misma voz",`La voz del fondo se vuelve más clara.\n\nDice:\n\n— Ven. Necesito que vengas.\n\nConoces esa entonación.\n\nEsa pausa antes de la última palabra.\n\nEs tu voz.\n\nTe quitas los auriculares por un momento.\n\nNo puedes entender cómo es posible.`,["Escuchar la comparación"]],
      compare:["Dos grabaciones",`Pones las dos grabaciones una junto a la otra.\n\nLa transmisión de la radio.\n\nLa llamada telefónica.\n\nLas voces son idénticas.\n\nNo solo parecidas.\n\nReconoces la manera en que pronuncias cada palabra.\n\nLa llamada no la hizo tu compañero.\n\nLa hiciste tú.\n\nO alguien que suena exactamente como tú.`,["Intentar enviar un mensaje","Apagar todos los equipos"]],
      transmit:["El mensaje",`Te sientas frente al micrófono.\n\nNecesitas advertir a la otra versión de ti.\n\nNecesitas impedir que salga de la cabina.\n\nPulsas el botón de transmisión.\n\n— ¿Puedes oírme?\n\nLa estática responde.\n\nRespiras hondo.\n\n— Soy yo. No contestes el teléfono dentro de cinco minutos.\n\nDurante unos segundos, no hay respuesta.\n\nEntonces oyes:\n\n— ¿Quién habla?`,["Seguir hablando"]],
      night4end:["El comienzo",`Reconoces la pregunta.\n\nEs exactamente lo que preguntaste la primera noche.\n\nIntentas explicarlo.\n\nIntentas advertirte.\n\nPero la transmisión empieza a fallar.\n\nTe das cuenta de que estás repitiendo las mismas palabras que escuchaste.\n\nEl mismo mensaje.\n\nLa misma secuencia.\n\nFIN DE LA NOCHE 04.`,["Continuar a la noche 05"]],
      night5:["La cabina",`Estás otra vez frente al micrófono.\n\nLa frecuencia está abierta.\n\nEl teléfono está sobre la mesa.\n\nLa grabación está lista.\n\nSabes lo que pasó.\n\nSabes que intentaste impedir la llamada.\n\nSabes que tu compañero no volvió.\n\nY sabes que, en algún momento, alguien entró en la cabina.\n\nMiras el vidrio que separa la cabina del pasillo.\n\nUna figura se acerca.`,["Observar la figura","Intentar transmitir otra vez"]],
      finalScene:["El reflejo",`La figura entra en la cabina.\n\nLa misma camisa.\n\nLa misma postura.\n\nLos mismos movimientos.\n\nIntentas verle la cara.\n\nPor un instante, la persona se vuelve hacia ti.\n\nY todo encaja.\n\nLa cabina.\n\nLa fotografía.\n\nLa llamada.\n\nLa voz.\n\nRecuerdas la primera noche, cuando viste entrar a alguien y simplemente lo ignoraste.\n\nEntonces se te escapa la pregunta:\n\n"Espera... ¿ese soy yo?"\n\nEl hombre se sienta frente al micrófono.\n\nOrdena los objetos sobre la mesa.\n\nExactamente como tú sueles hacerlo.\n\nLo entiendes.\n\nEsa llamada fue tuya.\n\nEsa transmisión fue tuya.\n\nIntentabas impedir algo que ya formaba parte de la secuencia.\n\nEl teléfono suena.\n\nLa radio está abierta.\n\nY, al otro lado, alguien todavía no sabe lo que está a punto de suceder.`,["Contestar el teléfono","Hablar por la radio","Permanecer en silencio"]],
      trueEnding:["SET 002",`La estática llena la cabina.\n\nLa transmisión continúa.\n\nUna voz empieza a hablar.\n\nTu voz.\n\n— No contestes el teléfono dentro de cinco minutos.\n\nEl reloj marca las 23:55.\n\nReconoces cada detalle.\n\nLa frase.\n\nLa pausa.\n\nLa respiración.\n\nLa estación sigue funcionando.\n\nEl turno aún no ha terminado.\n\nY, en algún punto del tiempo, todo comienza otra vez.\n\n"Algunas frecuencias no transmiten el pasado. Lo repiten."\n\nFIN DE LA TRANSMISIÓN.\n\nSET 002: MIDNIGHT FREQUENCY`,["Volver al inicio"]],
      gameover:["Señal perdida",`Apagas los equipos.\n\nLa estación queda en silencio.\n\nDurante unos segundos, parece que todo ha terminado.\n\nEntonces suena el teléfono.\n\nLo miras.\n\nLa pantalla no muestra ningún número.\n\nLa transmisión desaparece.\n\nLa frecuencia se ha perdido.\n\nGAME OVER — SEÑAL PERDIDA.`,["Intentar de nuevo"]]
    }
  }

let language = localStorage.getItem("set002-language") || "pt";
let current = "start";
const menu = document.getElementById("menu");
const game = document.getElementById("game");
const languageSelect = document.getElementById("languageSelect");

function updateMenuLanguage(){
  const t = I18N[language];
  document.documentElement.lang = language === "pt" ? "pt-BR" : language;
  document.getElementById("menuTitle").textContent = t.menuTitle;
  document.getElementById("menuDescription").textContent = t.menuDescription;
  document.getElementById("languageLabel").textContent = t.languageLabel;
  document.getElementById("startButton").textContent = t.start;
  document.getElementById("menuHint").textContent = t.menuHint;
}
languageSelect.value = language;
updateMenuLanguage();

languageSelect.addEventListener("change", () => {
  language = languageSelect.value;
  localStorage.setItem("set002-language", language);
  updateMenuLanguage();
  if (!game.classList.contains("hidden")) render(current);
});

document.getElementById("startButton").addEventListener("click", () => {
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  render("start");
});

function render(id){
  current = id;
  const t = I18N[language];
  const scene = t.scenes[id];
  const [sceneTitle, sceneText, labels] = scene;
  document.getElementById("title").textContent = sceneTitle;
  const story = document.getElementById("story");
  story.textContent = sceneText;
  document.getElementById("nightLabel").textContent =
    `${t.night} 0${nightByScene[id]} / 05`;
  document.getElementById("clock").textContent = clockFor(id);
  document.getElementById("progress").style.width =
    `${nightByScene[id] * 20}%`;

  const options = document.getElementById("options");
  options.innerHTML = "";

  if(id === "photo"){
    const photo = document.createElement("div");
    photo.className = "photo";
    photo.innerHTML = `<div class="photo-frame">♡</div><small>${language==="en"?"An old photograph.":language==="es"?"Una fotografía antigua.":"Uma fotografia antiga."}</small><small>${language==="en"?"You and your mother.":language==="es"?"Tú y tu madre.":"Você e sua mãe."}</small>`;
    story.appendChild(photo);
  }

  labels.forEach((label,index)=>{
    const button = document.createElement("button");
    button.textContent = "› " + label;
    button.addEventListener("click",()=>{
      const next = routes[id][index];
      if(id === "trueEnding" || id === "gameover"){
        menu.classList.remove("hidden");
        game.classList.add("hidden");
        return;
      }
      render(next);
    });
    options.appendChild(button);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function clockFor(id){
  const clocks = {
    start:"23:47:00",equipment:"23:51:12",photo:"23:52:04",radio:"23:55:00",
    answerRadio:"23:56:10",noteFrequency:"23:56:10",radioOff:"23:56:10",
    phone:"00:00:00",phoneAnswer:"00:00:17",phoneWait:"00:01:03",
    callBack:"00:02:21",outside:"00:06:42",stranger:"00:08:30",
    endNight1:"00:09:00",night2:"23:47:00",recording:"23:52:00",
    file:"23:52:00",night2radio:"23:58:00",night2end:"00:04:00",
    night3:"23:49:00",memory:"23:53:00",night3radio:"23:58:00",
    night3end:"00:06:00",night4:"23:50:00",callReveal:"23:54:00",
    compare:"23:57:00",transmit:"00:01:00",night4end:"00:05:00",
    night5:"23:55:00",finalScene:"00:00:00",trueEnding:"00:05:00",
    gameover:"00:01:00"
  };
  return clocks[id] || "00:00:00";
}
</script>
